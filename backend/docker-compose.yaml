version: "3.8"
name: keef-backend

services:
  api:
    build: .
    container_name: keef-api
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PORT=:8080
      - DB_PATH=/app/data/keef.db
      - JWT_SECRET=abcd
      - GIN_MODE=debug
