basePath: /api
definitions:
  models.ChangePasswordRequest:
    properties:
      newPassword:
        type: string
      password:
        type: string
      repeatNewPassword:
        type: string
    required:
    - newPassword
    - password
    - repeatNewPassword
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.Transaction:
    properties:
      amount:
        type: integer
      bank:
        type: string
      category:
        type: string
      date:
        type: string
      description:
        type: string
      id:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: A financial tracking API
  title: Keef API
  version: "1.0"
paths:
  /statistics/total-spent:
    get:
      consumes:
      - application/json
      description: Get total spending amount for the authenticated user with optional
        filters
      parameters:
      - description: Category filter
        in: query
        name: category
        type: string
      - description: Start date (RFC3339 format)
        in: query
        name: startDate
        type: string
      - description: End date (RFC3339 format)
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Total spending amount
          schema:
            additionalProperties: true
            type: object
        "400":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get total spending statistics
      tags:
      - statistics
  /statistics/total-spent-category:
    get:
      consumes:
      - application/json
      description: Get total spending amount grouped by category for the authenticated
        user
      parameters:
      - description: Start date (RFC3339 format)
        in: query
        name: startDate
        type: string
      - description: End date (RFC3339 format)
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Spending by category
          schema:
            additionalProperties: true
            type: object
        "400":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get spending statistics by category
      tags:
      - statistics
  /transactions:
    get:
      consumes:
      - application/json
      description: Retrieve paginated transactions for the authenticated user with
        optional category filter
      parameters:
      - description: Page number
        in: query
        name: page
        required: true
        type: integer
      - description: Category filter
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of transactions
          schema:
            items:
              $ref: '#/definitions/models.Transaction'
            type: array
        "400":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get user transactions
      tags:
      - transactions
  /transactions/{id}/delete:
    delete:
      consumes:
      - application/json
      description: Delete a specific transaction by ID for the authenticated user
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Transaction deleted successfully
        "400":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete a transaction
      tags:
      - transactions
  /transactions/create:
    post:
      consumes:
      - application/json
      description: Create a new financial transaction for the authenticated user
      parameters:
      - description: Transaction data
        in: body
        name: transaction
        required: true
        schema:
          $ref: '#/definitions/models.Transaction'
      produces:
      - application/json
      responses:
        "201":
          description: id
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create a new transaction
      tags:
      - transactions
  /users/change-password:
    post:
      consumes:
      - application/json
      description: Change the password for the authenticated user
      parameters:
      - description: Password change data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Change user password
      tags:
      - authentication
  /users/token:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: access_token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - authentication
securityDefinitions:
  ApiKeyAuth:
    description: Bearer token authentication
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
