name: 'kooleh'
version: '1.0'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PORT=:8080
      - JWT_SECRET=secret
      - DB_PATH=/app/data/kooleh.db
      - CORS_ALLOW_ORIGINS=http://localhost:3000
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped
